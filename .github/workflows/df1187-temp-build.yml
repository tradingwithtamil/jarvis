name: TEMP DF1187 FundingPips Full Package Build

on:
  push:
    paths:
      - ".github/workflows/df1187-temp-build.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download and verify canonical v11.87 base package
        shell: bash
        run: |
          set -euo pipefail
          URL='https://warehouse-beta-rats-hughes.trycloudflare.com/DF1187_FULL.zip'
          EXPECT='b4a8961418191f79a6d36e56bc32186f116072ca34a119363d4373442c5b0b3e'
          curl -fL --retry 3 --connect-timeout 20 --max-time 300 -o /tmp/base.zip "$URL"
          GOT="$(sha256sum /tmp/base.zip | awk '{print $1}')"
          test "$GOT" = "$EXPECT"
          mkdir -p work
          unzip -q /tmp/base.zip -d work
          echo "BASE_SHA256=$GOT"

      - name: Add FundingPips Normal Funded + Full Port + Golden Bullet matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path("work")
          balances = ["5K","10K","25K","50K","100K"]
          names = [f"A{i}.set" for i in range(1,11)]

          def first(text,key):
              m=re.search(rf"(?m)^{re.escape(key)}=([^|\r\n]*)",text)
              return None if not m else m.group(1)

          def setline(text,key,value):
              pat=re.compile(rf"(?m)^{re.escape(key)}=.*$")
              line=f"{key}={value}||{value}||{'0.0' if '.' in value else '0'}||{value}||N"
              return pat.sub(line,text,count=1) if pat.search(text) else text+("\n" if not text.endswith("\n") else "")+line+"\n"

          def setraw(text,key,line):
              pat=re.compile(rf"(?m)^{re.escape(key)}=.*$")
              return pat.sub(f"{key}={line}",text,count=1) if pat.search(text) else text+("\n" if not text.endswith("\n") else "")+f"{key}={line}\n"

          gb={
            "InpDedicatedFundedUseNormalMode":"false",
            "InpFundedTradingMode":"1",
            "InpNormalModeRR":"4.0",
            "InpPhase1TradingMode":"1",
            "InpPhase2TradingMode":"1",
            "InpUseGoldenBulletRiskFormula":"true",
          }
          fp={
            "InpDedicatedFundedUseNormalMode":"false",
            "InpFundedQuickRR":"2.0",
            "InpFundedTradingMode":"2",
            "InpNormalModeRR":"4.0",
            "InpPhase1QuickRR":"2.0",
            "InpPhase1TradingMode":"2",
            "InpPhase2QuickRR":"2.0",
            "InpPhase2TradingMode":"2",
            "InpUseFullPortPassMode":"true",
            "InpFullPortActivateOnlyInLastDDZone":"false",
            "InpFullPortRiskPctOfStart":"5.0",
            "InpFullPortUseMaxRiskPctCap":"false",
            "InpFullPortUseRawPhaseTarget":"false",
          }

          def funded(text):
              text=setraw(text,"InpQuickAccountStage","2||2||0||2||N")
              text=setraw(text,"InpPortfolioStage","FUNDED")
              text=setraw(text,"InpBotToken","")
              text=setraw(text,"InpPortfolioGlobalTelegramReader","false||false||0||false||N")
              return text

          def mode(text,changes):
              for k,v in changes.items():
                  text=setline(text,k,v)
              return text

          def validate(path,mode_name,stage):
              text=path.read_text(encoding="utf-8-sig")
              guards={
                "InpPropFirmProfile":"1",
                "InpExcelMaxRiskPctPerTrade":"1.0",
                "InpUseDailyLossLock":"true",
                "InpUseAccountWideDailyDD":"true",
                "InpUsePropFirmSafetyBuffer":"true",
                "InpStopTradingTodayIfRiskExceedsDailyLimit":"true",
                "InpExcelCapByDailyLoss":"true",
              }
              for k,v in guards.items():
                  if first(text,k)!=v:
                      raise RuntimeError(f"FundingPips guard mismatch {k} in {path}")
              expect_stage={"Phase 1":"0","Phase 2":"1","Funded":"2"}[stage]
              expect_port={"Phase 1":"PHASE1","Phase 2":"PHASE2","Funded":"FUNDED"}[stage]
              if first(text,"InpQuickAccountStage")!=expect_stage or first(text,"InpPortfolioStage")!=expect_port:
                  raise RuntimeError(f"Stage mismatch in {path}")
              if mode_name=="Golden Bullet":
                  if first(text,"InpUseGoldenBulletRiskFormula")!="true":
                      raise RuntimeError(f"Golden Bullet flag mismatch in {path}")
              if mode_name=="Full Port":
                  if first(text,"InpUseFullPortPassMode")!="true":
                      raise RuntimeError(f"Full Port flag mismatch in {path}")

          roots=[]
          for p in root.rglob("FundingPips"):
              t=p/"2 Step Standard"
              if t.is_dir() and p.parent.name in {"SET_FILES","02_SET_FILES"}:
                  roots.append(t)
          roots=list(dict.fromkeys(x.resolve() for x in roots))
          if not roots:
              raise RuntimeError("No FundingPips 2 Step Standard roots found")

          before=sum(1 for _ in root.rglob("*.set"))
          added=0
          for r in roots:
              p1=r/"Normal"/"Phase 1"
              p2=r/"Normal"/"Phase 2"
              for b in balances:
                  if sorted(x.name for x in (p1/b).glob("*.set"))!=sorted(names): raise RuntimeError(f"P1 matrix invalid {r} {b}")
                  if sorted(x.name for x in (p2/b).glob("*.set"))!=sorted(names): raise RuntimeError(f"P2 matrix invalid {r} {b}")

              nf=r/"Normal"/"Funded"
              if nf.exists(): shutil.rmtree(nf)
              for b in balances:
                  (nf/b).mkdir(parents=True,exist_ok=True)
                  for n in names:
                      out=funded((p2/b/n).read_text(encoding="utf-8-sig"))
                      (nf/b/n).write_text(out,encoding="utf-8",newline="")
                      added+=1

              for mname,changes in [("Full Port",fp),("Golden Bullet",gb)]:
                  md=r/mname
                  if md.exists(): shutil.rmtree(md)
                  for stage,src in [("Phase 1",p1),("Phase 2",p2),("Funded",nf)]:
                      for b in balances:
                          d=md/stage/b; d.mkdir(parents=True,exist_ok=True)
                          for n in names:
                              out=mode((src/b/n).read_text(encoding="utf-8-sig"),changes)
                              (d/n).write_text(out,encoding="utf-8",newline="")
                              added+=1

              for mname in ["Normal","Full Port","Golden Bullet"]:
                  for stage in ["Phase 1","Phase 2","Funded"]:
                      files=list((r/mname/stage).rglob("*.set"))
                      if len(files)!=50: raise RuntimeError(f"{r} {mname}/{stage} count={len(files)}")
                      for f in files: validate(f,mname,stage)

          after=sum(1 for _ in root.rglob("*.set"))
          if after-before!=added: raise RuntimeError(f"SET delta mismatch before={before} after={after} added={added}")
          print(f"FUNDINGPIPS_ROOTS={len(roots)}")
          print(f"SET_BEFORE={before}")
          print(f"SET_ADDED={added}")
          print(f"SET_AFTER={after}")
          PY

      - name: Validate full package ZIP without compiling EA
        shell: bash
        run: |
          set -euo pipefail
          (cd work && zip -qr /tmp/verify.zip .)
          unzip -tq /tmp/verify.zip
          echo "VERIFY_ZIP_SHA256=$(sha256sum /tmp/verify.zip | awk '{print $1}')"
          echo "EA_COMPILE=NOT_RUN"

      - name: Upload short-lived full package artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DF1187_FULL_FIXED_${{ github.run_id }}
          path: work/**
          include-hidden-files: true
          compression-level: 6
          retention-days: 1
          if-no-files-found: error

      - name: Print artifact proof
        shell: bash
        run: |
          echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
          echo "ARTIFACT_SHA256=${{ steps.upload.outputs.artifact-digest }}"
          echo "ARTIFACT_URL=${{ steps.upload.outputs.artifact-url }}"

      - name: Keep artifact briefly for secure handoff then delete
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          sleep 900
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" || true
